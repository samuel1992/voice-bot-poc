<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Extension WebSocket Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 {
            color: #4ec9b0;
        }
        .controls {
            margin: 20px 0;
            padding: 15px;
            background: #252526;
            border-radius: 5px;
        }
        input {
            padding: 8px;
            margin: 5px;
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #555;
            border-radius: 3px;
        }
        button {
            padding: 8px 15px;
            margin: 5px;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background: #1177bb;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .connected {
            background: #1e5128;
            color: #4ec9b0;
        }
        .disconnected {
            background: #5a1e1e;
            color: #f48771;
        }
        .log {
            background: #252526;
            padding: 15px;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            font-size: 12px;
            margin-top: 20px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 3px 0;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .stat-box {
            background: #252526;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            color: #4ec9b0;
            font-weight: bold;
        }
        .stat-label {
            font-size: 12px;
            color: #858585;
        }
    </style>
</head>
<body>
    <h1>Virtual Extension WebSocket Test</h1>

    <div class="controls">
        <label>Host:</label>
        <input type="text" id="host" value="localhost" placeholder="localhost">
        <label>Port:</label>
        <input type="text" id="port" value="8383" placeholder="8383">
        <br>
        <label>Company ID:</label>
        <input type="text" id="companyId" value="vili01" placeholder="vili01">
        <label>Extension:</label>
        <input type="text" id="extension" value="3001" placeholder="3001">
        <br>
        <button type="button" id="connectBtn" onclick="connect()">Connect</button>
        <button type="button" id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
        <button type="button" id="testToneBtn" onclick="playTestTone()" disabled>Play Test Tone</button>
        <button type="button" onclick="clearLog()">Clear Log</button>
        <br><br>
        <label>Load .raw audio file (16-bit PCM, 8kHz, mono):</label>
        <input type="file" id="rawFile" accept=".raw" onchange="loadRawFile()">
        <button type="button" id="playRawBtn" onclick="playRawFile()" disabled>Play Loaded Audio</button>
        <br><br>
        <label><input type="checkbox" id="transcriptionEnabled" onchange="toggleTranscription()"> Enable Transcription (Fireworks AI)</label>
        <br>
        <div id="transcriptionSettings" style="display: none; margin-top: 10px;">
            <label>Fireworks API Key:</label>
            <input type="password" id="fireworksApiKey" placeholder="fw_..." style="width: 300px;">
        </div>
    </div>

    <div id="status" class="status disconnected">Disconnected</div>

    <div class="stats">
        <div class="stat-box">
            <div class="stat-value" id="frameCount">0</div>
            <div class="stat-label">Frames Received</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="dataSize">0 KB</div>
            <div class="stat-label">Total Data</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="fps">0</div>
            <div class="stat-label">Frames/Second</div>
        </div>
    </div>

    <div class="log" id="log"></div>

    <div style="margin-top: 20px; padding: 15px; background: #252526; border-radius: 5px;">
        <h3 style="color: #4ec9b0; margin-top: 0;">Transcription</h3>
        <div id="transcriptionOutput" style="color: #d4d4d4; min-height: 50px; font-size: 14px; line-height: 1.6;">
            No transcription available
        </div>
    </div>

    <script>
        let ws = null;
        let frameCount = 0;
        let totalBytes = 0;
        let startTime = null;
        let lastSecondFrames = 0;
        let lastSecondTime = Date.now();
        let loadedRawAudio = null;
        let transcriptionManager = null;

        class TranscriptionManager {
            constructor(apiKey) {
                this.apiKey = apiKey;
                this.socket = null;
                this.isConnected = false;
                this.segmentState = {};
            }

            async connect() {
                const url = `wss://audio-streaming.api.fireworks.ai/v1/audio/transcriptions/streaming?authorization=${encodeURIComponent(this.apiKey)}&language=pt&response_format=verbose_json`;

                log('Connecting to Fireworks AI transcription service...');
                this.socket = new WebSocket(url);
                this.socket.binaryType = 'arraybuffer';

                return new Promise((resolve, reject) => {
                    this.socket.onopen = () => {
                        log('Transcription WebSocket connected', 'success');
                        this.isConnected = true;
                        resolve();
                    };

                    this.socket.onmessage = (event) => {
                        try {
                            const message = JSON.parse(event.data);
                            this.handleTranscriptMessage(message);
                        } catch (err) {
                            log(`Failed to parse transcription message: ${err.message}`, 'error');
                            console.error('Parse error:', err, 'Data:', event.data);
                        }
                    };

                    this.socket.onerror = (error) => {
                        log('Transcription WebSocket error', 'error');
                        console.error('WebSocket error:', error);
                        reject(error);
                    };

                    this.socket.onclose = (event) => {
                        log(`Transcription closed (code: ${event.code})`, event.code === 1000 ? 'info' : 'error');
                        this.isConnected = false;
                        if (event.code !== 1000) {
                            reject(new Error(`Connection closed with code ${event.code}`));
                        }
                    };
                });
            }

            handleTranscriptMessage(message) {
                if (message.text) {
                    const output = document.getElementById('transcriptionOutput');
                    output.innerHTML = `<div style="color: #4ec9b0; margin-bottom: 8px;">${message.text}</div>`;
                    output.scrollTop = output.scrollHeight;

                    // Log transcription update
                    if (!this.lastLoggedText || this.lastLoggedText !== message.text) {
                        log(`Transcription: "${message.text}"`, 'success');
                        this.lastLoggedText = message.text;
                    }
                }
            }

            sendAudio(audioData) {
                if (!this.isConnected || !this.socket || this.socket.readyState !== WebSocket.OPEN) {
                    return;
                }

                // Fireworks expects 16kHz but we have 8kHz audio
                // We need to upsample from 8kHz to 16kHz
                const upsampled = this.upsample8kTo16k(audioData);
                this.socket.send(upsampled);

                // Log every 50 frames
                if (!this.audioFrameCount) this.audioFrameCount = 0;
                this.audioFrameCount++;
                if (this.audioFrameCount % 50 === 0) {
                    log(`Sent ${this.audioFrameCount} audio frames to Fireworks (${(this.audioFrameCount * 640 / 1024).toFixed(1)} KB)`, 'data');
                }
            }

            upsample8kTo16k(audioData) {
                // Simple linear interpolation upsampling
                // Input: 160 samples @ 8kHz (320 bytes)
                // Output: 320 samples @ 16kHz (640 bytes)
                const inputSamples = new Int16Array(audioData.buffer || audioData);
                const outputSamples = new Int16Array(inputSamples.length * 2);

                for (let i = 0; i < inputSamples.length - 1; i++) {
                    outputSamples[i * 2] = inputSamples[i];
                    outputSamples[i * 2 + 1] = Math.round((inputSamples[i] + inputSamples[i + 1]) / 2);
                }
                outputSamples[outputSamples.length - 2] = inputSamples[inputSamples.length - 1];
                outputSamples[outputSamples.length - 1] = inputSamples[inputSamples.length - 1];

                return outputSamples.buffer;
            }

            disconnect() {
                if (this.socket) {
                    this.socket.close();
                    this.socket = null;
                }
                this.isConnected = false;
                this.segmentState = {};
            }
        }

        async function toggleTranscription() {
            const enabled = document.getElementById('transcriptionEnabled').checked;
            const settings = document.getElementById('transcriptionSettings');
            settings.style.display = enabled ? 'block' : 'none';

            if (enabled && ws && ws.readyState === WebSocket.OPEN && !transcriptionManager) {
                await startTranscription();
            } else if (!enabled && transcriptionManager) {
                transcriptionManager.disconnect();
                transcriptionManager = null;
                document.getElementById('transcriptionOutput').innerHTML = 'No transcription available';
            }
        }

        async function startTranscription() {
            const apiKey = document.getElementById('fireworksApiKey').value;

            if (!apiKey) {
                log('Fireworks API key required for transcription', 'error');
                document.getElementById('transcriptionEnabled').checked = false;
                toggleTranscription();
                return;
            }

            try {
                transcriptionManager = new TranscriptionManager(apiKey);
                await transcriptionManager.connect();
                document.getElementById('transcriptionOutput').innerHTML = '<em style="color: #858585;">Waiting for audio...</em>';
            } catch (err) {
                log(`Failed to start transcription: ${err.message}`, 'error');
                transcriptionManager = null;
                document.getElementById('transcriptionEnabled').checked = false;
                toggleTranscription();
            }
        }

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';

            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '[ERROR]' : type === 'success' ? '[SUCCESS]' : type === 'data' ? '[DATA]' : '[INFO]';

            entry.textContent = `[${timestamp}] ${prefix} ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStats() {
            document.getElementById('frameCount').textContent = frameCount;
            document.getElementById('dataSize').textContent = (totalBytes / 1024).toFixed(1) + ' KB';

            const now = Date.now();
            if (now - lastSecondTime >= 1000) {
                const fps = Math.round(lastSecondFrames * 1000 / (now - lastSecondTime));
                document.getElementById('fps').textContent = fps;
                lastSecondFrames = 0;
                lastSecondTime = now;
            }
        }

        function connect() {
            const host = document.getElementById('host').value;
            const port = document.getElementById('port').value;
            const companyId = document.getElementById('companyId').value;
            const extension = document.getElementById('extension').value;
            const url = `ws://${host}:${port}/ws/virtual-extension/${companyId}/${extension}`;

            log(`Connecting to ${url}...`);

            ws = new WebSocket(url);
            ws.binaryType = 'arraybuffer';

            ws.onopen = async () => {
                log('WebSocket connected successfully!', 'success');
                document.getElementById('status').className = 'status connected';
                document.getElementById('status').textContent = 'Connected';
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                document.getElementById('testToneBtn').disabled = false;

                frameCount = 0;
                totalBytes = 0;
                startTime = Date.now();
                lastSecondFrames = 0;
                lastSecondTime = Date.now();

                if (document.getElementById('transcriptionEnabled').checked) {
                    await startTranscription();
                }
            };

            ws.onmessage = (event) => {
                if (typeof event.data === 'string') {
                    // Text message - JSON status
                    try {
                        const message = JSON.parse(event.data);

                        if (message.event === 'callstart') {
                            log(`Call started - metadata: ${JSON.stringify(message.metadata)}`, 'success');
                            document.getElementById('status').className = 'status connected';
                            document.getElementById('status').textContent = 'Call Active';
                        } else if (message.event === 'callend') {
                            log('Call ended (hangup)', 'info');
                            document.getElementById('status').className = 'status disconnected';
                            document.getElementById('status').textContent = 'Call Ended';
                        } else {
                            log(`Unknown event: ${message.event}`, 'error');
                        }
                    } catch (err) {
                        log(`Failed to parse JSON message: ${err.message}`, 'error');
                    }
                } else {
                    // Binary message - audio data
                    const data = new Uint8Array(event.data);

                    if (data.length === 320) {
                        // Audio frame
                        frameCount++;
                        lastSecondFrames++;
                        totalBytes += data.length;

                        if (frameCount === 1) {
                            log(`First frame received: ${data.length} bytes`, 'data');
                            log(`First 10 bytes: [${Array.from(data.slice(0, 10)).join(', ')}]`);
                        } else if (frameCount % 50 === 0) {
                            log(`Received ${frameCount} frames (${(totalBytes / 1024).toFixed(1)} KB)`, 'data');
                        }

                        if (transcriptionManager) {
                            transcriptionManager.sendAudio(data);
                        }

                        updateStats();
                    } else {
                        log(`Received binary message with unexpected length: ${data.length} bytes`, 'error');
                    }
                }
            };

            ws.onerror = (error) => {
                log(`WebSocket error occurred`, 'error');
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                log(`WebSocket closed. Total: ${frameCount} frames, ${(totalBytes / 1024).toFixed(1)} KB`);
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('status').textContent = 'Disconnected';
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
                document.getElementById('testToneBtn').disabled = true;
            };
        }

        function disconnect() {
            if (ws) {
                log('Disconnecting...');
                ws.close();
                ws = null;
            }

            if (transcriptionManager) {
                transcriptionManager.disconnect();
                transcriptionManager = null;
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            log('Log cleared');
        }

        function loadRawFile() {
            const fileInput = document.getElementById('rawFile');
            const file = fileInput.files[0];

            if (!file) return;

            log(`Loading raw audio file: ${file.name} (${(file.size / 1024).toFixed(1)} KB)...`);

            const reader = new FileReader();
            reader.onload = (e) => {
                loadedRawAudio = new Uint8Array(e.target.result);
                const durationSeconds = (loadedRawAudio.length / 320 * 0.02).toFixed(2);
                log(`Loaded ${loadedRawAudio.length} bytes (~${durationSeconds}s at 8kHz)`, 'success');
                document.getElementById('playRawBtn').disabled = false;
            };
            reader.onerror = () => {
                log('Failed to read file', 'error');
            };
            reader.readAsArrayBuffer(file);
        }

        function playRawFile() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('WebSocket not connected!', 'error');
                return;
            }

            if (!loadedRawAudio) {
                log('No audio file loaded!', 'error');
                return;
            }

            log(`Playing raw audio file (${loadedRawAudio.length} bytes)...`);

            const frameSize = 320;
            const totalFrames = Math.floor(loadedRawAudio.length / frameSize);
            let sentFrames = 0;

            const interval = setInterval(() => {
                if (sentFrames >= totalFrames || !ws || ws.readyState !== WebSocket.OPEN) {
                    clearInterval(interval);
                    log(`Finished playing audio (${sentFrames} frames)`, 'success');
                    return;
                }

                const start = sentFrames * frameSize;
                const end = start + frameSize;
                const frame = loadedRawAudio.slice(start, end);

                // Pad with zeros if last frame is incomplete
                if (frame.length < frameSize) {
                    const paddedFrame = new Uint8Array(frameSize);
                    paddedFrame.set(frame);
                    ws.send(paddedFrame.buffer);
                } else {
                    ws.send(frame.buffer);
                }

                sentFrames++;

                if (sentFrames % 50 === 0) {
                    log(`Sent ${sentFrames}/${totalFrames} frames (${((sentFrames / totalFrames) * 100).toFixed(1)}%)`, 'data');
                }
            }, 20); // Send one frame every 20ms
        }

        function playTestTone() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('WebSocket not connected!', 'error');
                return;
            }

            log('Sending test tone (440Hz, 1 second)...');

            const sampleRate = 8000;
            const duration = 1;
            const frequency = 440;
            const samplesPerFrame = 160; // 20ms at 8kHz
            const totalFrames = Math.floor((sampleRate * duration) / samplesPerFrame);

            let sentFrames = 0;

            const interval = setInterval(() => {
                if (sentFrames >= totalFrames || !ws || ws.readyState !== WebSocket.OPEN) {
                    clearInterval(interval);
                    log(`Finished sending test tone (${sentFrames} frames)`, 'success');
                    return;
                }

                // Generate 160 samples of sine wave
                const frame = new Int16Array(160);
                for (let i = 0; i < 160; i++) {
                    const sampleIndex = sentFrames * 160 + i;
                    const sample = Math.sin(2 * Math.PI * frequency * sampleIndex / sampleRate);
                    frame[i] = Math.round(sample * 16000); // Scale to 16-bit
                }

                // Convert to bytes (little-endian)
                const bytes = new Uint8Array(320);
                for (let i = 0; i < 160; i++) {
                    bytes[i * 2] = frame[i] & 0xFF;
                    bytes[i * 2 + 1] = (frame[i] >> 8) & 0xFF;
                }

                ws.send(bytes.buffer);
                sentFrames++;
            }, 20); // Send one frame every 20ms
        }

        // Log initial message
        log('Ready to connect. Enter extension number and click Connect.');
    </script>
</body>
</html>
